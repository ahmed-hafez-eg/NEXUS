<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky blue radial background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5BC8F5"/>
      <stop offset="60%" stop-color="#1E9FD4"/>
      <stop offset="100%" stop-color="#0B6FA4"/>
    </radialGradient>
    <!-- Sign face gradient (cream/wood) -->
    <linearGradient id="signFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="50%" stop-color="#F5E9C8"/>
      <stop offset="100%" stop-color="#E8D5A0"/>
    </linearGradient>
    <!-- Sign shadow/depth (dark brown bottom) -->
    <linearGradient id="signDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#1A0C04"/>
    </linearGradient>
    <!-- Sign left side depth -->
    <linearGradient id="signLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A1A08"/>
      <stop offset="100%" stop-color="#4A2E14"/>
    </linearGradient>
    <!-- Post gradient -->
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="40%" stop-color="#C49A28"/>
      <stop offset="100%" stop-color="#7A5C10"/>
    </linearGradient>
    <!-- Post shadow -->
    <linearGradient id="postShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A2408"/>
      <stop offset="100%" stop-color="#5A3A10"/>
    </linearGradient>
    <!-- Text gradient - deep dark blue/black -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0A2E"/>
      <stop offset="100%" stop-color="#0A0518"/>
    </linearGradient>
    <!-- Text 3D highlight -->
    <linearGradient id="textHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A1A5E"/>
      <stop offset="100%" stop-color="#1A0A2E"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#00000055"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#00000077"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle (app icon shape) -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bgGrad)"/>

  <!-- Subtle cloud-like highlight at top -->
  <ellipse cx="256" cy="80" rx="180" ry="50" fill="white" opacity="0.12"/>

  <!-- === SIGN POST === -->
  <!-- Post shadow -->
  <rect x="245" y="295" width="30" height="145" rx="4" fill="url(#postShadow)"/>
  <!-- Post main -->
  <rect x="240" y="290" width="32" height="145" rx="5" fill="url(#postGrad)"/>
  <!-- Post highlight -->
  <rect x="244" y="290" width="6" height="145" rx="3" fill="#E8C040" opacity="0.5"/>

  <!-- === 3D SIGN BODY === -->
  <!-- Bottom/depth face (3D illusion - bottom edge) -->
  <rect x="72" y="278" width="374" height="18" rx="3" fill="url(#signDepth)" filter="url(#dropShadow)"/>
  <!-- Left depth face (3D illusion - left edge) -->
  <polygon points="72,145 88,131 88,278 72,278" fill="url(#signLeft)"/>

  <!-- Main sign face -->
  <rect x="88" y="131" width="360" height="147" rx="6" fill="url(#signFace)" filter="url(#dropShadow)"/>

  <!-- Sign face inner border (wood grain feel) -->
  <rect x="94" y="137" width="348" height="135" rx="4" fill="none" stroke="#C9A85A" stroke-width="2" opacity="0.6"/>

  <!-- Decorative corner screw/nail dots -->
  <circle cx="106" cy="149" r="5" fill="#A07830" stroke="#7A5020" stroke-width="1.5"/>
  <circle cx="430" cy="149" r="5" fill="#A07830" stroke="#7A5020" stroke-width="1.5"/>
  <circle cx="106" cy="259" r="5" fill="#A07830" stroke="#7A5020" stroke-width="1.5"/>
  <circle cx="430" cy="259" r="5" fill="#A07830" stroke="#7A5020" stroke-width="1.5"/>

  <!-- === NEXUS TEXT (Bold, 3D cartoon style) === -->
  <!-- Text shadow/depth layer (offset) -->
  <text x="268" y="225"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="86"
    font-weight="900"
    text-anchor="middle"
    fill="#0A0518"
    opacity="0.4"
    transform="translate(4,5)">NEXUS</text>

  <!-- Main text -->
  <text x="268" y="225"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="86"
    font-weight="900"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#textShadow)"
    letter-spacing="-2">NEXUS</text>

  <!-- Text top highlight (3D effect) -->
  <text x="268" y="225"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="86"
    font-weight="900"
    text-anchor="middle"
    fill="none"
    stroke="#5A3080"
    stroke-width="1"
    opacity="0.3"
    letter-spacing="-2">NEXUS</text>

  <!-- === SPARKLE / STAR DECORATIONS === -->
  <!-- Top-left sparkle (4-pointed star) -->
  <g transform="translate(115, 95)">
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#1A3A6A" opacity="0.85"/>
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#2A5A9A" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="white" opacity="0.8"/>
  </g>

  <!-- Top-right sparkle (larger) -->
  <g transform="translate(395, 75)">
    <polygon points="0,-22 5,-5 22,0 5,5 0,22 -5,5 -22,0 -5,-5" fill="#1A3A6A" opacity="0.9"/>
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#2A5A9A" opacity="0.5"/>
    <circle cx="0" cy="0" r="3.5" fill="white" opacity="0.85"/>
  </g>

  <!-- Small sparkle top-center-right -->
  <g transform="translate(440, 118)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#1A3A6A" opacity="0.75"/>
    <circle cx="0" cy="0" r="2" fill="white" opacity="0.7"/>
  </g>

  <!-- Small sparkle top-center-left -->
  <g transform="translate(75, 115)">
    <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5" fill="#1A3A6A" opacity="0.7"/>
    <circle cx="0" cy="0" r="1.8" fill="white" opacity="0.65"/>
  </g>

  <!-- Bottom-right sparkle -->
  <g transform="translate(420, 370)">
    <polygon points="0,-14 3.5,-3.5 14,0 3.5,3.5 0,14 -3.5,3.5 -14,0 -3.5,-3.5" fill="#1A3A6A" opacity="0.8"/>
    <circle cx="0" cy="0" r="2.5" fill="white" opacity="0.75"/>
  </g>

  <!-- Bottom-left sparkle (tiny) -->
  <g transform="translate(100, 380)">
    <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#1A3A6A" opacity="0.65"/>
    <circle cx="0" cy="0" r="1.5" fill="white" opacity="0.6"/>
  </g>

  <!-- === SMALL DOTS (random sky decoration) === -->
  <circle cx="170" cy="60" r="3" fill="white" opacity="0.5"/>
  <circle cx="340" cy="45" r="2" fill="white" opacity="0.4"/>
  <circle cx="450" cy="320" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="65" cy="290" r="2" fill="white" opacity="0.35"/>
  <circle cx="470" cy="170" r="1.8" fill="white" opacity="0.3"/>
  <circle cx="50" cy="200" r="1.5" fill="white" opacity="0.3"/>

  <!-- Bottom ground shadow under post -->
  <ellipse cx="256" cy="438" rx="45" ry="8" fill="#00000033"/>
</svg>
