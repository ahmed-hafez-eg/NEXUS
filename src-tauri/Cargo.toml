[package]
name = "nexus"
version = "1.0.0"
description = "Knowledge Connected"
authors = ["Ahmed Hafez <ahmedhafez.officialksa@gmail.com>"]
license = "MIT"
repository = "https://github.com/ahmed-hafez-eg/NEXUS"
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
